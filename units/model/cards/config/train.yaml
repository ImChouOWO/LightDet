data:
  dataset_dir: datasets
  image_size: 1024
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: datasets/.cache/images_1024_uint8
  prebuild_image_cache: true
  cache_workers: 8

  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  query_budget: true

  # ODVG phrase-level negatives. Phrases are appended to the complete caption
  # without a bbox, so they supervise token alignment only.
  negative_query_path: units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.15
  negative_phrase_max_per_image: 3
  negative_phrase_separator: "；負向描述："
  use_negative_queries_in_val: false

train:
  epochs: 300
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16
  device: cuda:1
  seed: 49
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high
  channels_last: false

  compile: false
  compile_mode: reduce-overhead
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0

optim:
  # [mode, max_lr, min_lr, start_epoch, end_epoch]
  components:
    vision: ["cosine", 0.0001, 0.000005, 0.00, 1.00]
    text: ["cosine", 0.00001, 0.0000005, 0.00, 1.00]
    transformer: ["cosine", 0.0001, 0.000005, 0.00, 1.00]
    head: ["cosine", 0.0001, 0.000005, 0.00, 1.00]

  weight_decay: 0.0001
  max_warmup_steps: 3000
  fused: true

loss:
  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0

    # Localization quality remains in matching to preserve the current learned
    # ranking behavior.
    cost_score: 2.0
    score_cost_type: focal
    focal_alpha: 0.25
    focal_gamma: 2.0

    # ODVG query-to-phrase token alignment cost.
    cost_alignment: 2.0
    alignment_negative_weight: 0.25

  weight:
    dynamic: true
    bbox: 5.0
    giou: 2.0
    score: 1.0

    bbox_start: 5.0
    bbox_end: 3.5
    giou_start: 2.0
    giou_end: 2.0
    score_start: 1.0
    score_end: 4.0

    start_epoch: 1
    end_epoch: 30
    schedule: cosine

  classification:
    type: iou
    ia_bce_alpha: 0.25
    focal_alpha: 0.25
    focal_gamma: 2.0
    negative_weight: 0.25
    normalize_by_num_gt: true

    negative_iou_ignore_thr: 0.50
    negative_iou_ignore_start: 0.55
    negative_iou_ignore_end: 0.45
    negative_iou_ignore_start_epoch: 5
    negative_iou_ignore_end_epoch: 25
    negative_iou_ignore_schedule: cosine

  quality:
    iou_pos_thr: 0.0
    quality_min: 0.10
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 10
    aux_score_enabled: true

  text_alignment:
    enabled: true
    loss_weight: 1.0

    # Matched query: non-phrase valid tokens.
    negative_weight: 0.25

    # Unmatched query: every valid caption token.
    unmatched_weight: 0.10

    # Retained for future ODVG negative-caption rows.
    negative_text_weight: 1.0

    focal_gamma: 2.0

    # Matched query must rank above the hardest unmatched query for the same GT
    # phrase token map.
    ranking_weight: 0.25
    ranking_margin: 0.15

    start_epoch: 1
    warmup_epoch: 5

  matcher_schedule:
    start_epoch: 5
    warmup_epoch: 12
    alpha_min: 0.0

  score_sampling:
    positive_ratio: 1.0
    max_positive_per_gt: 5
    min_extra_positive_iou: 0.0
    hard_negative_ratio: 5
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  hybrid:
    aux_loss_weight: 0.50
    matcher_cost_score: 2.0
    matcher_cost_alignment: 2.0
    warmup_epoch: 3
    decay_start_ratio: 0.75
    min_factor: 0.25
    matcher_score_start_epoch: 5
    matcher_score_warmup_epoch: 10

  text_negative:
    as_empty_target: true
    classification_weight: 1.0
    max_query_loss_weight: 4.0
    lambda_text_negative: 0.25
    text_negative_topk: 20
    hard_topk: 20
    text_negative_hard_mix: 0.50
    hard_mix: 0.50
    start_epoch: 1
    warmup_epoch: 5

  duplicate_suppression:
    enabled: true
    loss_weight: 0.10
    margin: 0.25
    background_weight: 0.05
    classification_weight: 0.25
    max_pairs: 128
    start_epoch: 5
    warmup_epoch: 5

  hard_negative:
    enabled: true
    loss_weight: 0.05
    topk: 10
    max_iou: 0.30
    start_epoch: 10
    warmup_epoch: 5

  # Legacy quality-ranking configuration remains disabled. Phrase ranking is
  # now part of text_alignment and uses GT token maps.
  ranking:
    enabled: false
    lambda_rank: 0.0
    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512
    rank_start_epoch: 5
    rank_warmup_epoch: 12
    rank_alpha_min: 0.0
    rank_negative_iou_max: 0.20

  query_refinement:
    identity_weight: 0.0
    start_epoch: 1
    warmup_epoch: 5
    detach_localization: true

  pos_weight:
    value: 1.0

eval:
  val_loss_interval: 5
  eval_interval: 1
  max_val_batches: null

  score_thr: 0.001
  top_k: 20
  nms_iou_thr: 0.5
  use_nms: false
  use_topk_fallback: false

  iou_thresholds: null
  compute_raw_oracle: true
  raw_oracle_iou_thresholds: [0.25, 0.50, 0.75]
  best_metric: map50_95

log:
  save_dir: units/model/runs/train/lightdet_ODVG_token_alignment

  # The token-alignment projection heads are new parameters. Use weights-only
  # loading for an old checkpoint; do not resume its optimizer state.
  weights_path: null
  resume_path: null
  prefer_ema: true

  save_latest_interval: 1
  save_epoch_interval: 50
  emit_step_metrics: false
  log_interval: 50
  progress_leave: true
  progress_mininterval: 0.5
