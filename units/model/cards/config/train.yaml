data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.15
  use_negative_queries_in_val: true


train:
  epochs: 100
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16

  device: cuda:1
  seed: 49
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  compile_mode: reduce-overhead
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0


optim:
  lr_vision: 0.000100
  lr_text: 0.000075
  lr_transformer: 0.000150

  
  lr_head: 0.000200

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 4000
  fused: true


loss:
  hybrid:
    aux_loss_weight: 0.35
    aux_cost_score: 0.0

  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.0

  score_sampling:
    hard_negative_ratio: 5
    positive_ratio: 1.0
    max_positive_per_gt: 2
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.10
    quality_min: 0.15
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 10
    score_match_rounds: 1
    score_quality_gamma: 1.0
    score_round_decay: 0.25
    score_min_iou: 0.05

    # 動態 score-negative ignore threshold。
    # Epoch 1~5 固定 0.50；Epoch 5~25 以 cosine 降至 0.45；
    # Epoch 25 後固定 0.45。
    score_negative_iou_ignore_start: 0.10
    score_negative_iou_ignore_end: 0.5
    score_negative_iou_ignore_start_epoch: 5
    score_negative_iou_ignore_end_epoch: 50
    score_negative_iou_ignore_schedule: cosine

    aux_score_enabled: false

  ranking:
    enabled: true
    lambda_rank: 0.03
    rank_margin: 0.10
    rank_min_quality_gap: 0.15
    rank_max_pairs: 512

    rank_start_epoch: 3
    rank_warmup_epoch: 50
    rank_alpha_min: 0.02

    # 只有 max IoU <= 0.20 的候選可作為 ranking negative。
    rank_negative_iou_max: 0.20

  text_negative:
    # query_loss_weights 的上限；獨立負文字 loss 已另外加權，因此降為 2。
    max_query_loss_weight: 2.0

    # 對負文字 query 的全部 100 個 score 施加 target=0 QFL。
    lambda_text_negative: 0.50

    # 同時強化最難壓低的 Top-20 prediction。
    text_negative_topk: 20
    text_negative_hard_mix: 0.50

  weight:
    dynamic: true

    bbox_start: 5.0
    bbox_end: 4.5
    bbox_decay_until: 0.5

    giou: 2.0

    score_start: 1.5
    score_end: 2.0
    score_warm_until: 0.5

  pos_weight:
    value: 2.0


eval:
  val_loss_interval: 2
  eval_interval: 1
  max_val_batches: null

  score_thr: 0.001

  # 100 會保留所有 prediction，無法觀察 score 排序與負文字抑制。
  top_k: 20

  nms_iou_thr: 0.5
  use_nms: false
  use_topk_fallback: false

  iou_thresholds: null
  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_dir: runs/train/lightdet_HDETR_textaware_dynamic
  resume_path: null

  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5
