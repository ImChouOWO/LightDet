data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 1024
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.10
  use_negative_queries_in_val: true


train:
  epochs: 100
  batch_size: 48
  warmup_epochs: 2
  num_workers: 16

  device: cuda:1
  seed: 47
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 2.0


optim:
  lr_vision: 0.000150
  lr_text: 0.000080
  lr_transformer: 0.000250
  lr_head: 0.000400

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 800
  fused: true


loss:
  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.05

  score_sampling:
    hard_negative_ratio: 16
    positive_ratio: 1.0
    max_positive_per_gt: 2
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.1
    quality_min: 0.0
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 8

  ranking:
    lambda_rank: 0.01
    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512
    rank_start_epoch: 15
    rank_warmup_epoch: 25
    rank_alpha_min: 0.0

  text_negative:
    max_query_loss_weight: 10.0

  weight:
    dynamic: true
    bbox_start: 5.0
    bbox_end: 4.0
    bbox_decay_until: 0.4
    giou: 2.0
    score_start: 2.0
    score_end: 3.0
    score_warm_until: 0.4

  pos_weight:
    value: 2.5


eval:
  val_loss_interval: 2
  eval_interval: 1
  max_val_batches: null

  score_thr: 0.001
  top_k: 20
  nms_iou_thr: 0.5
  use_nms: true
  use_topk_fallback: false

  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_dir: runs/train/lightdet_decoupled_scratch_aggressive_seed47
  resume_path: null

  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5