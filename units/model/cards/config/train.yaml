# ============================================================
# LightDet train.yaml
# Aligned one-to-many bbox / GIoU / IoU-aware QFL supervision
# YAML is the single source of training parameters.
# ============================================================

data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8
  pin_memory: true
  query_budget_batching: true

train:
  epochs: 300
  batch_size: 48
  warmup_epochs: 5
  num_workers: 16
  device: cuda:1
  seed: 45
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  channels_last: false
  compile_model: false
  compile_mode: reduce-overhead
  profile_steps: false
  profile_interval: 50

  use_ema: true
  ema_decay: 0.999
  grad_clip_norm: 1.0

optim:
  lr_vision: 0.0001
  lr_text: 0.00001
  lr_transformer: 0.0001
  lr_head: 0.0001
  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 3000

loss:
  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.0

  score_sampling:

    hard_negative_ratio: 3
    positive_ratio: 1.0
    max_positive_per_gt: 2
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.0
    quality_min: 0.0
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 10

  ranking:
    lambda_rank: 0.3
    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512
    rank_start_epoch: 30
    rank_warmup_epoch: 60
    rank_alpha_min: 0.0001

  weight:
    dynamic: false

    bbox: 5.0
    bbox_start: 5.0
    bbox_end: 5.0
    bbox_decay_until: 1.0

    giou: 2.0

    score: 2.0
    score_start: 2.0
    score_end: 2.0
    score_warm_until: 1.0

  pos_weight:
    value: 1.0

eval:
  val_loss_interval: 5
  eval_interval: 1
  max_val_batches: null
  score_thr: 0.001
  top_k: 20
  nms_iou_thr: 0.5
  best_metric: map50_95
  use_topk_fallback: false

log:
  save_dir: runs/train/lightdet_aligned_qfl
  resume_path: null
  save_epoch_interval: 50
  emit_step_metrics: false
  log_interval: 50

  # tqdm 僅顯示一行必要資訊，避免終端寬度不足造成換行或破版。
  progress_dynamic_ncols: true
  progress_leave: true
  progress_mininterval: 0.5
  progress_smoothing: 0.1
  progress_bar_width: 20
