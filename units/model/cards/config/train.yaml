data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.05
  use_negative_queries_in_val: false


train:
  epochs: 100
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16

  device: cuda:1
  seed: 47
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  compile_mode: reduce-overhead
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0


optim:
  lr_vision: 0.000100
  lr_text: 0.000050
  lr_transformer: 0.000150
  lr_head: 0.000250

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 4000
  fused: true


loss:
  # Main branch 使用 Hungarian One-to-One。
  # Auxiliary branch 使用 One-to-Many。
  hybrid:
    aux_loss_weight: 0.5
    aux_cost_score: 0.0

  # Main One-to-One matcher
  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.0

  # Auxiliary One-to-Many assignment / score sampling
  score_sampling:
    hard_negative_ratio: 8
    positive_ratio: 1.0
    max_positive_per_gt: 2
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.1
    quality_min: 0.0
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 15

  ranking:
    lambda_rank: 0.1
    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512
    rank_start_epoch: 30
    rank_warmup_epoch: 50
    rank_alpha_min: 0.0

  text_negative:
    max_query_loss_weight: 4.0

  weight:
    dynamic: true
    bbox_start: 5.0
    bbox_end: 4.5
    bbox_decay_until: 0.5
    giou: 2.0
    score_start: 1.5
    score_end: 2.5
    score_warm_until: 0.5

  pos_weight:
    value: 2.0


eval:
  val_loss_interval: 2
  eval_interval: 1
  max_val_batches: null

  # 僅評估 Main One-to-One branch。
  score_thr: 0.001
  top_k: 100
  nms_iou_thr: 0.5
  use_nms: false
  use_topk_fallback: false

  iou_thresholds: null
  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_dir: runs/train/lightdet_hybrid_grid10_seed47
  resume_path: null

  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5
