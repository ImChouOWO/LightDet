# ============================================================
# LightDet train.yaml - quality-aware confidence + ranking loss
# ============================================================

data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

train:
  epochs: 300
  batch_size: 24
  warmup_epochs: 5
  num_workers: 8
  device: cuda:1
  seed: 44
  deterministic: false
  use_amp: true
  use_ema: false
  ema_decay: 0.999
  grad_clip_norm: 1.0

optim:
  lr_vision: 0.0001
  lr_text: 0.00001
  lr_transformer: 0.0001
  lr_head: 0.0001
  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 3000

loss:
  matcher:
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.0

  score_sampling:
    hard_negative_ratio: 5
    positive_ratio: 0.05
    max_positive_per_gt: 2
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.2
    quality_min: 0.3
    quality_max: 1.0
    qfl_beta: 2.0
    quality_warmup_epoch: 10

  ranking:
    lambda_rank: 0.25
    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512
    rank_start_epoch: 5
    rank_warmup_epoch: 10

  weight:
    dynamic: true

    bbox: 5.0
    bbox_start: 5.0
    bbox_end: 3.0
    bbox_decay_until: 0.5

    giou: 2.0

    score: 2.0
    score_start: 2.0
    score_end: 4.0
    score_warm_until: 0.4

  pos_weight:
    value: 1.0

eval:
  val_loss_interval: 5
  eval_interval: 1
  max_val_batches: 320
  score_thr: 0.25
  top_k: 20
  nms_iou_thr: 0.5
  best_metric: map50
  use_topk_fallback: false

log:
  save_dir: null
  resume_path: null
  save_epoch_interval: 50
  emit_step_metrics: false
  log_interval: 50