data:
  dataset_dir: datasets
  image_size: 640
  text_max_length: 256
  train_split: train
  val_split: val
train:
  epochs: 100
  batch_size: 8
  workers: 8
  device: cuda:1
  seed: 49
  amp: true
  warmup_epochs: 1
  max_warmup_steps: 2000
  grad_clip: 1.0
  gt_roi_hold_epochs: 5
  gt_roi_end_epoch: 15
  gt_roi_weight: 0.5
  guided_candidates_epochs: 5
optim:
  vision_lr: 0.00001
  fpn_lr: 0.0001
  text_lr: 0.00002
  head_lr: 0.0001
  min_lr_ratio: 0.05
  weight_decay: 0.0001
loss:
  bbox_weight: 5.0
  giou_weight: 2.0
  dense_weight: 1.0
  quality_weight: 1.0
  alignment_weight: 1.0
  selection_weight: 1.0
  ranking_weight: 0.25
eval:
  score_threshold: 0.5
  nms_iou: 0.5
  max_detections: 100
log:
  save_dir: units/model/runs/train
  prefix: lightdet_gref
  best_metric: grec_precision_f1
