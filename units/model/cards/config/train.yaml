data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true

  # train.py 最多只使用 2。
  prefetch_factor: 2
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.15
  use_negative_queries_in_val: true


train:
  epochs: 60
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16

  device: cuda:1
  seed: 51
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0


optim:
  lr_vision: 0.000150
  lr_text: 0.000060
  lr_transformer: 0.000220
  lr_head: 0.000380

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 4000
  fused: true


loss:
  hybrid:
    # H-DETR one-to-many auxiliary regression。
    aux_loss_weight: 0.28


  matcher:
    # DETR / Rank-DETR 2:5:2 Hungarian matching。
    cost_score: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0

    score_cost_type: focal
    focal_alpha: 0.25


  matcher_schedule:
    # 逐步增加文字條件分數對 Hungarian matching 的影響。
    start_epoch: 1
    warmup_epoch: 12
    alpha_min: 0.10


  score_sampling:
    # H-DETR auxiliary branch 的每個 GT 重複配對數。
    max_positive_per_gt: 2

    # 每個 GT 最多選取的 hard-negative 比例。
    # 實際數量仍受 hard_negative.topk 限制。
    hard_negative_ratio: 5


  quality:
    # Auxiliary 重複配對框的最低 IoU。
    iou_pos_thr: 0.10

    # Main matched query 的品質目標範圍。
    quality_min: 0.10
    quality_max: 1.0
    quality_warmup_epoch: 10

    # Auxiliary branch 僅提供定位監督。
    aux_score_enabled: false


  classification:
    # Align-DETR 式 IoU-aware BCE。
    type: ia_bce
    ia_bce_alpha: 0.25
    focal_gamma: 2.0

    # 依 batch 中 GT 數量正規化。
    normalize_by_num_gt: true

    # 未被 Hungarian 配對，但與任一 GT 的 IoU >= 0.50：
    # 不再使用完整的背景 IA-BCE 壓到 0，
    # 改交由 duplicate_suppression 處理。
    negative_iou_ignore_thr: 0.50


  duplicate_suppression:
    # 處理與 GT 高度重疊、但未被 Hungarian 選中的重複框。
    enabled: true

    # Duplicate Loss 加入總 Loss 的權重。
    loss_weight: 0.10

    # 要求 matched TP 的 logit 高於 duplicate logit。
    # z_tp >= z_duplicate + margin
    margin: 0.25

    # Duplicate 仍保留少量背景抑制，
    # 避免完全忽略後維持過高分數。
    background_weight: 0.05

    # 每個 batch 最多處理的 duplicate pairs。
    max_pairs: 128

    # 前幾個 epoch 定位尚未穩定，先不啟用。
    start_epoch: 5


  hard_negative:
    # 抑制低 IoU 但置信度過高的真正背景框。
    enabled: true

    # Hard-negative Loss 加入總 Loss 的權重。
    loss_weight: 0.05

    # 每筆文字查詢最多選取的高分負樣本數。
    topk: 10

    # 只有與所有 GT 的最大 IoU <= 0.30，
    # 才能作為真正 hard negative。
    max_iou: 0.30

    # Duplicate ranking 穩定後再啟用。
    start_epoch: 10


  text_negative:
    # 負文字視為 empty-target DETR sample。
    as_empty_target: true

    # 額外抑制負文字下分數最高的預測。
    lambda_text_negative: 0.20
    text_negative_topk: 20
    text_negative_hard_mix: 0.50
    max_query_loss_weight: 4.0


  weight:
    dynamic: true

    bbox_start: 5.0
    bbox_end: 4.5
    bbox_decay_until: 0.5

    giou: 2.0

    # Classification 維持固定權重。
    score_start: 2.0
    score_end: 2.0


eval:
  val_loss_interval: 2
  eval_interval: 1

  # AP 計算時保留完整置信度排序。
  score_thr: 0.0
  top_k: 20

  # 部署型評估：移除同一文字查詢下的高度重疊框。
  use_nms: true

  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5