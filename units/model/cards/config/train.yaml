data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.15
  use_negative_queries_in_val: true


train:
  epochs: 60
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16

  device: cuda:1
  seed: 51
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  compile_mode: reduce-overhead
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0


optim:
  lr_vision: 0.000150
  lr_text: 0.000060
  lr_transformer: 0.000220
  lr_head: 0.000380

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 4000
  fused: true


loss:
  hybrid:
    # H-DETR-style one-to-many auxiliary regression.
    aux_loss_weight: 0.28
    aux_cost_score: 0.0

  matcher:
    # DETR/Rank-DETR-style 2:5:2 matching cost.
    cost_score: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0

    # Focal matching cost used by DETR-family implementations.
    score_cost_type: focal
    focal_alpha: 0.25
    focal_gamma: 2.0

  matcher_schedule:
    # Reuses the previous ranking schedule concept.
    # The schedule now increases the score term in Hungarian matching.
    start_epoch: 1
    warmup_epoch: 12
    alpha_min: 0.10

  score_sampling:
    # Only H-DETR auxiliary matching still uses these fields.
    positive_ratio: 1.0
    max_positive_per_gt: 2
    aux_positive_label: 0.7
    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    # Minimum IoU for additional H-DETR repeated matches.
    iou_pos_thr: 0.10

    # Matched one-to-one quality target range.
    quality_min: 0.10
    quality_max: 1.0
    quality_warmup_epoch: 10

    # Auxiliary branch remains regression-only.
    aux_score_enabled: false

  classification:
    # Align-DETR-style IoU-aware BCE target for matched queries.
    type: ia_bce
    ia_bce_alpha: 0.25

    focal_alpha: 0.25
    focal_gamma: 2.0

    # DETR-style normalization by the number of matched GT boxes.
    normalize_by_num_gt: true

  text_negative:
    # Negative captions become empty-target DETR samples:
    # no positive matching and no bbox/GIoU regression.
    as_empty_target: true

    # Main classification already supervises every query as no-object.
    # This term only reinforces the highest-scoring negative queries.
    lambda_text_negative: 0.20
    text_negative_topk: 20
    text_negative_hard_mix: 0.50
    max_query_loss_weight: 4.0

  ranking:
    # Explicit dense pairwise ranking is removed.
    enabled: false
    lambda_rank: 0.0

    # Kept as aliases for older train.py parameter readers.
    rank_start_epoch: 5
    rank_warmup_epoch: 12
    rank_alpha_min: 0.10

  weight:
    dynamic: true

    bbox_start: 5.0
    bbox_end: 4.5
    bbox_decay_until: 0.5

    giou: 2.0

    # Official Rank-DETR classification weight scale.
    score_start: 2.0
    score_end: 2.0
    score_warm_until: 0.5

  pos_weight:
    # Retained only for old train.py compatibility; DETR-native loss ignores it.
    value: 1.0


eval:
  val_loss_interval: 2
  eval_interval: 1
  max_val_batches: null

  score_thr: 0.001
  top_k: 20

  nms_iou_thr: 0.5
  use_nms: false
  use_topk_fallback: false

  iou_thresholds: null
  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_dir: runs/train/lightdet_detr_native_iabce_seed51
  resume_path: null

  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5
