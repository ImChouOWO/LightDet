data:
  dataset_dir: /home/soic/Desktop/LightDet/datasets
  image_size: 512
  max_text_aug_per_image: 1

  cache_images: true
  image_cache_dir: /home/soic/Desktop/LightDet/datasets/.cache/images_512_uint8
  prebuild_image_cache: true
  prefetch_factor: 4
  cache_workers: 8

  pin_memory: true
  persistent_workers: true
  query_budget: true

  negative_query_path: /home/soic/Desktop/LightDet/units/model/cards/cache/negative_query_pool.json
  negative_sample_ratio: 0.05
  use_negative_queries_in_val: false


train:
  epochs: 100
  batch_size: 48
  warmup_epochs: 3
  num_workers: 16

  device: cuda:1
  seed: 48
  deterministic: false

  use_amp: true
  amp_dtype: bf16
  allow_tf32: true
  matmul_precision: high

  channels_last: false
  compile: false
  compile_mode: reduce-overhead
  startup_smoke_test: true

  use_ema: true
  ema_decay: 0.999
  ema_update_interval: 1
  ema_buffer_update_interval: 1

  grad_clip_norm: 1.0


optim:
  lr_vision: 0.000100
  lr_text: 0.000050
  lr_transformer: 0.000150
  lr_head: 0.000250

  weight_decay: 0.0001
  min_lr_ratio: 0.05
  max_warmup_steps: 4000
  fused: true


loss:
  hybrid:
    # Aux 只負責增加定位正樣本。
    aux_loss_weight: 0.35
    aux_cost_score: 0.0

  matcher:
    # Main regression Hungarian cost。
    cost_bbox: 5.0
    cost_giou: 2.0
    cost_score: 0.0

  score_sampling:
    # QFL hard-negative mining。
    hard_negative_ratio: 5

    # H-DETR repeated-GT matcher 不實際依賴 positive_ratio，
    # 保留此欄位只為了相容既有 train.py。
    positive_ratio: 1.0

    # H-DETR One-to-Many 的 K。
    max_positive_per_gt: 2

    # Aux score目前關閉，此參數僅保留相容性。
    aux_positive_label: 0.7

    expand_cost_bbox: 5.0
    expand_cost_giou: 2.0

  quality:
    iou_pos_thr: 0.1
    quality_min: 0.0
    quality_max: 1.0
    qfl_beta: 2.0

    # 讓 quality target 在 Epoch 5 前完成 warmup。
    quality_warmup_epoch: 5

    # Main score使用獨立 IoU-only One-to-One assignment。
    score_match_rounds: 1
    score_quality_gamma: 1.0
    score_round_decay: 0.25
    score_min_iou: 0.0

    # Aux只做 bbox/GIoU，不直接訓練 score。
    aux_score_enabled: false

  ranking:
    enabled: true

    # Ranking最大貢獻權重。
    lambda_rank: 0.05

    rank_margin: 0.1
    rank_min_quality_gap: 0.1
    rank_max_pairs: 512

    # 從 Epoch 5 開始。
    rank_start_epoch: 5

    # 從 Epoch 5 起，經過25個epoch逐漸升到完整權重。
    rank_warmup_epoch: 25

    # 確保 Epoch 5 就有非零 ranking：
    # effective lambda = 0.05 × 0.05 = 0.0025
    rank_alpha_min: 0.05

  text_negative:
    max_query_loss_weight: 4.0

  weight:
    dynamic: true

    bbox_start: 5.0
    bbox_end: 4.5
    bbox_decay_until: 0.5

    giou: 2.0

    # 已加入 ranking，因此 QFL不再提高至2.5。
    score_start: 1.5
    score_end: 2.0
    score_warm_until: 0.5

  pos_weight:
    value: 2.0


eval:
  val_loss_interval: 2
  eval_interval: 1
  max_val_batches: null

  # 僅評估 Main One-to-One branch。
  score_thr: 0.001
  top_k: 100

  nms_iou_thr: 0.5
  use_nms: false
  use_topk_fallback: false

  iou_thresholds: null
  best_metric: map50_95

  compute_raw_oracle: true
  raw_oracle_iou_thresholds:
    - 0.25
    - 0.50
    - 0.75


log:
  save_dir: runs/train/lightdet_Decouple_HDETR_rank_epoch5
  resume_path: null

  save_latest_interval: 1
  save_epoch_interval: 5

  emit_step_metrics: true
  log_interval: 20

  progress_leave: true
  progress_mininterval: 0.5